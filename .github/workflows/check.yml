name: Check Sharon Art Studio classes

# GitHub cron times are UTC. Written for Pacific Standard Time (UTC-8),
# with the Saturday lines also covering daylight time, so no edits needed.
on:
  schedule:
    # Regular checks: about every 2 hours, 7 AM to 11 PM Pacific (standard time).
    - cron: "23 1,3,5,7,15,17,19,21,23 * * *"
    # Saturday registration mornings (10 AM PT): start a run that checks every
    # 30 seconds until 10:30 AM PT. Two times for standard/daylight time plus a
    # backup each; "Decide mode" skips any that fall outside 9:30-10:30 AM PT.
    - cron: "40 17 * * 6"
    - cron: "50 17 * * 6"
    - cron: "40 16 * * 6"
    - cron: "50 16 * * 6"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email instead of checking"
        type: boolean
        default: false
      test_polling:
        description: "Test the Saturday polling loop (runs for 2 minutes)"
        type: boolean
        default: false
      saturday_poll:
        description: "Saturday polling (for the outside timer; only runs 9:30-10:30 AM PT Saturdays)"
        type: boolean
        default: false

concurrency:
  group: sharon-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Decide mode
        id: mode
        run: |
          now=$((10#$(TZ=America/Los_Angeles date +%H%M)))
          dow=$(TZ=America/Los_Angeles date +%u)   # 6 = Saturday
          in_window=false
          if [ "$dow" = 6 ] && [ "$now" -ge 930 ] && [ "$now" -lt 1030 ]; then in_window=true; fi

          mode=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "40 17 * * 6"|"50 17 * * 6"|"40 16 * * 6"|"50 16 * * 6")
                if [ "$in_window" = true ]; then mode="saturday"; else mode="skip"; fi ;;
            esac
          elif [ "${{ inputs.saturday_poll }}" = "true" ]; then
            if [ "$in_window" = true ]; then mode="saturday"; else mode="skip"; fi
          elif [ "${{ inputs.test_polling }}" = "true" ]; then
            mode="test"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Pacific time: $now (day $dow), mode: ${mode:-normal check}"

      - uses: actions/checkout@v4
        if: steps.mode.outputs.mode != 'skip'

      - name: Run watcher
        if: steps.mode.outputs.mode != 'skip'
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TEST_EMAIL: ${{ inputs.test_email }}
          POLL_MODE: ${{ steps.mode.outputs.mode }}
        run: python3 sharon_watcher.py

      - name: Save state
        if: steps.mode.outputs.mode != 'skip'
        run: |
          git config user.name "sharon-watcher-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update class state"
          git pull --rebase -q && git push
