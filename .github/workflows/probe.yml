name: probe
on:
  workflow_dispatch:
  push:
    paths-ignore: ["probe-result.txt"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe.py
      - name: Save result
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "probe result" && git push || true
